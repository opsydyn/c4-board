[package]
name = "c4-board"
version = "0.0.7"
description = "OPSYDYN C4 Board desktop application"
authors = ["OPSYDYN"]
edition = "2021"
license = "MIT"
repository = "https://github.com/opsydyn/c4-board"
homepage = "https://github.com/opsydyn/c4-board"
include = [
  "Cargo.toml",
  "build.rs",
  "src/**",
  "migrations/**",
  "icons/**",
  "gen/schemas/**",
  "tauri.conf.json",
  "release-plz.toml",
  "release-plz-surface.json",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tauri_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-shell = "2.3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tokio = { version = "1.48.0", features = ["full"] }
tauri-plugin-http = "2.5.9"
# Direct sqlx access for properly configured SQLite pool (plugin pool lacks busy_timeout)
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
# Load testing dependencies
reqwest = { version = "0.12", features = ["json", "stream"] }
hdrhistogram = "7.5"
governor = "0.7"
futures = "0.3"
bytes = "1.7"
rig-core = "0.40"
keyring = "3.6"

[dev-dependencies]
proptest = "1"
