[workspace]
# This repo ships a Tauri desktop app, but the frontend lives outside src-tauri/.
# The release workflow may stage src-tauri/release-plz-surface.json so release-plz
# still sees frontend-only app changes as releasable package updates.
allow_dirty = true

git_only = true
publish = false
publish_no_verify = true
release_always = true
# Reverted from ADR-013 Phase 2's draft-then-publish. Apple has not processed a
# notarisation for this team in over a day, and a gate that waits for every
# platform means nothing ships at all — v0.0.9, v0.0.10 and v0.0.11 all sat as
# drafts with no assets. Shipping Linux and Windows beats shipping nothing.
#
# The cost is knowingly reaccepted: releases/latest resolves to a release whose
# assets are still uploading, for roughly the length of the build. That matters
# to the updater (ADR-013) and is why the draft gate existed; restore it once
# notarisation is reliable.
git_release_draft = false
# Generate release notes from the commit history. This was off, so v0.0.6 was
# published with an empty body despite carrying 115 commits. 119 of the 123
# commits in that range were conventional, so generated notes are worth having.
changelog_update = true
semver_check = false

git_tag_name = "v{{ version }}"
git_release_name = "c4-board v{{ version }}"

pr_labels = ["release"]
