name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "*.afdesign"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload desktop assets for
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # Developer ID signing and notarisation. macOS is the primary platform, and the
  # updater replaces the .app in place — an unsigned replacement is refused by
  # Gatekeeper and leaves the user with an app that will not open (ADR-013 Phase 0).
  APPLE_SIGNING_ENABLED: "true"

jobs:
  release-gate:
    name: Release gate
    if: ${{ github.event_name == 'push' && github.repository_owner == 'opsydyn' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate environment schema
        run: bun run env:check

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run frontend tests
        run: bun run test:run

      - name: Build frontend with secret sentinel
        env:
          OPSYDYN_OPENAI_API_KEY: c4-board-build-secret-sentinel-v1
        run: bun run build

      - name: Scan frontend build for secret sentinel
        env:
          OPSYDYN_OPENAI_API_KEY: c4-board-build-secret-sentinel-v1
        run: bun run env:scan:build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Run Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  release-plz-pr:
    name: Release-plz PR
    if: ${{ github.event_name == 'push' && github.repository_owner == 'opsydyn' }}
    needs: release-gate
    # Tauri v2 writes ACL/schema artifacts under src-tauri/gen during cargo package --verify.
    # Our committed schema surface is stable on macOS, while Ubuntu regenerates Linux-specific
    # files during release-plz's packaging analysis and fails the release PR job.
    runs-on: macos-14
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Prepare release surface marker
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.before }}"
          if [[ "${base_ref}" == "0000000000000000000000000000000000000000" ]]; then
            base_ref="$(git hash-object -t tree /dev/null)"
          fi

          bun .github/scripts/prepare-release-plz-surface.ts "${base_ref}" "${GITHUB_SHA}" "src-tauri/release-plz-surface.json"

          if ! git diff --quiet -- src-tauri/release-plz-surface.json; then
            echo "Prepared src-tauri/release-plz-surface.json for app changes outside src-tauri/."
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify cargo package surface
        working-directory: src-tauri
        run: cargo package --allow-dirty

      - name: Run release-plz release-pr
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          config: src-tauri/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write PR workflow summary
        shell: bash
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
          PRS: ${{ steps.release-plz.outputs.prs }}
          PRS_CREATED: ${{ steps.release-plz.outputs.prs_created }}
        run: |
          set -euo pipefail
          {
            echo "## release-plz PR"
            echo
            echo "- Release PR created or updated: \`${PRS_CREATED:-false}\`"
            if [[ -n "${PR:-}" && "${PR}" != "{}" ]]; then
              echo "- Release PR: \`${PR}\`"
            elif [[ -n "${PRS:-}" && "${PRS}" != "[]" ]]; then
              echo "- Release PR payload: \`${PRS}\`"
            else
              echo "- No release PR was created or updated on this run."
              echo "- If this is unexpected, verify repo workflow permissions and whether release-surface files changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release-plz-release:
    name: Release-plz release
    if: ${{ github.event_name == 'push' && github.repository_owner == 'opsydyn' }}
    needs: release-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run release-plz release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          config: src-tauri/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release workflow summary
        shell: bash
        env:
          RELEASES_CREATED: ${{ steps.release-plz.outputs.releases_created }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          {
            echo "## release-plz release"
            echo
            echo "- Releases created: \`${RELEASES_CREATED:-false}\`"
            if [[ "${RELEASES_CREATED:-false}" == "true" ]]; then
              echo "- Release payload: \`${RELEASES}\`"
            else
              echo "- No GitHub release was created from this ref, so desktop bundling is skipped intentionally."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture release metadata
        id: meta
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          release_tag="$(jq -r '.[0].tag' <<<"${RELEASES}")"
          # The release is created as a draft (ADR-013 Phase 2), and
          # /releases/tags/{tag} only finds published releases, so list and filter.
          release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq "[.[] | select(.tag_name == \"${release_tag}\")] | first | .id")"
          if [[ -z "${release_id}" || "${release_id}" == "null" ]]; then
            echo "::error::No release found for tag ${release_tag}"
            exit 1
          fi
          # build-release-assets checks this tag out. A draft GitHub release does
          # not itself create a tag, so if release-plz ever stopped pushing one the
          # matrix would fail four times over with an opaque checkout error.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null; then
            echo "::error::Release ${release_tag} exists but its git tag was never pushed"
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "Released ${release_tag} via GitHub release ${release_id}"

  resolve-existing-release:
    name: Resolve existing release
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository_owner == 'opsydyn' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      # Listing drafts requires push access, not merely read.
      contents: write
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${{ inputs.release_tag }}"
          # Drafts are invisible to /releases/tags/{tag}, and a re-run targets a
          # release that has not been published yet by design.
          release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq "[.[] | select(.tag_name == \"${release_tag}\")] | first | .id")"
          if [[ -z "${release_id}" || "${release_id}" == "null" ]]; then
            echo "::error::No release found for tag ${release_tag}"
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${release_tag} to GitHub release ${release_id}"

  build-release-assets:
    name: Build release assets (${{ matrix.label }})
    if: ${{ always() && github.repository_owner == 'opsydyn' && (needs.release-plz-release.outputs.releases_created == 'true' || needs.resolve-existing-release.outputs.release_id != '') }}
    needs:
      - release-plz-release
      - resolve-existing-release
    runs-on: ${{ matrix.os }}
    # Raised from 60: the first macOS notarisation was still in progress when the
    # job was killed at exactly 60m, so we never learned whether it would finish.
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
          - os: macos-15-intel
            label: macos-x64
            macosAssetToken: darwin_x64
          - os: macos-14
            label: macos-arm64
            macosAssetToken: darwin_aarch64
          - os: windows-latest
            label: windows-x64
    env:
      RELEASE_ID: ${{ needs.release-plz-release.outputs.release_id != '' && needs.release-plz-release.outputs.release_id || needs.resolve-existing-release.outputs.release_id }}
      RELEASE_TAG: ${{ needs.release-plz-release.outputs.release_tag != '' && needs.release-plz-release.outputs.release_tag || needs.resolve-existing-release.outputs.release_tag }}
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      # The job above builds the released tag; GitHub runs this file from the ref
      # that triggered the workflow. Those never match — release-plz cuts its
      # release branch at a point in time, so anything merged afterwards is on main
      # and absent from the tag for good. Release tooling therefore comes from the
      # workflow's own ref, which also means a fix here applies to tags cut before
      # it. See test/config/release-workflow.test.ts.
      - name: Checkout release tooling from the workflow ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          path: .release-tooling

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux Tauri dependencies
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate environment schema
        if: ${{ hashFiles('.env.schema') != '' }}
        run: bun run env:check

      - name: Build frontend with secret sentinel
        if: ${{ hashFiles('.env.schema') != '' }}
        env:
          OPSYDYN_OPENAI_API_KEY: c4-board-build-secret-sentinel-v1
        run: bun run build

      - name: Scan frontend build for secret sentinel
        if: ${{ hashFiles('.env.schema') != '' }}
        env:
          OPSYDYN_OPENAI_API_KEY: c4-board-build-secret-sentinel-v1
        run: bun run env:scan:build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate Apple signing configuration
        if: ${{ startsWith(matrix.os, 'macos') && env.APPLE_SIGNING_ENABLED == 'true' }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          has_api_key=true
          for name in APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [[ -z "${!name:-}" ]]; then
              has_api_key=false
            fi
          done

          has_apple_id=true
          for name in APPLE_ID APPLE_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              has_apple_id=false
            fi
          done

          if [[ "${has_api_key}" != "true" && "${has_apple_id}" != "true" ]]; then
            missing+=("APPLE_API_KEY+APPLE_API_ISSUER+APPLE_API_KEY_P8 or APPLE_ID+APPLE_PASSWORD")
          fi

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing Apple signing/notarization secret(s): %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Export Apple signing secrets
        if: ${{ startsWith(matrix.os, 'macos') && env.APPLE_SIGNING_ENABLED == 'true' }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          # Export signing vars so tauri-action and tauri-bundler see them.
          # This step is skipped entirely when APPLE_SIGNING_ENABLED=false,
          # which keeps the vars absent from the build environment and prevents
          # tauri-bundler from calling `security import` with empty/missing data.
          #
          # Delegated to a tested script because the two ways this goes wrong both
          # surface an hour later as a notarisation failure: an unset secret exported
          # as empty makes tauri-bundler pick the Apple ID credentials over the API
          # key ones (it uses var_os, which cannot tell empty from absent), and a
          # line-wrapped base64 certificate corrupts GITHUB_ENV. See
          # .github/scripts/apple-signing-env.test.ts.
          bun .release-tooling/.github/scripts/apple-signing-env.ts

          if [[ -n "${APPLE_API_KEY:-}" && -n "${APPLE_API_KEY_P8:-}" ]]; then
            key_dir="${RUNNER_TEMP}/appstoreconnect"
            key_path="${key_dir}/AuthKey_${APPLE_API_KEY}.p8"
            mkdir -p "${key_dir}"
            printf '%s' "${APPLE_API_KEY_P8}" > "${key_path}"
            chmod 600 "${key_path}"
            echo "APPLE_API_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"
          fi

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          assetNamePattern: "[name]_[version]_[platform]_[arch][ext]"
          releaseDraft: false
          releaseId: ${{ env.RELEASE_ID }}
          tagName: ${{ env.RELEASE_TAG }}
          tauriScript: bun tauri
          includeUpdaterJson: false

      # Notarisation is deliberately outside `tauri build`: the bundler does it
      # inline with no progress output, no submission id, and no way to retry
      # without rebuilding — which cost two 50-minute jobs and left nothing to
      # query afterwards. The build above only signs (see apple-signing-env.ts).
      - name: Notarise and staple macOS bundles
        id: notarize
        # Non-fatal, deliberately and temporarily. Apple's notary service is
        # accepting this team's submissions and never processing them — four have
        # sat In Progress, the oldest for eleven hours, with no developer log for
        # any of them. Failing hard would block Linux and Windows releases too,
        # for a fault we cannot fix. The step below withdraws the macOS bundles
        # instead, so nothing ships that Gatekeeper will refuse. Revert to fatal
        # once Apple resolves the account (ADR-013 Phase 0).
        continue-on-error: true
        if: ${{ startsWith(matrix.os, 'macos') && env.APPLE_SIGNING_ENABLED == 'true' }}
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARIZE_TIMEOUT_MINUTES: "60"
        run: bun .release-tooling/.github/scripts/notarize-macos.run.ts

      # The bundles uploaded above carry no notarisation ticket. Re-uploading the
      # stapled ones replaces them by name; the release is still a draft at this
      # point (ADR-013 Phase 2), so no one can see the interim state.
      - name: Replace macOS assets with the stapled bundles
        if: ${{ startsWith(matrix.os, 'macos') && env.APPLE_SIGNING_ENABLED == 'true' && steps.notarize.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in target/release/bundle/dmg/*.dmg; do
            echo "Re-uploading stapled $(basename "${dmg}")"
            gh release upload "${RELEASE_TAG}" "${dmg}" --clobber
          done

      # tauri-action uploaded these before notarisation ran, so an unnotarised
      # bundle is already on the release. macOS refuses to open it — "Apple cannot
      # check it for malicious software" — which is a worse outcome than offering
      # no macOS download at all. Withdraw rather than ship something broken.
      - name: Withdraw unnotarised macOS assets
        if: ${{ startsWith(matrix.os, 'macos') && env.APPLE_SIGNING_ENABLED == 'true' && steps.notarize.outcome != 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_ASSET_TOKEN: ${{ matrix.macosAssetToken }}
        run: |
          set -euo pipefail

          # Scoped to this job's architecture: both macOS jobs target one release
          # concurrently, and a broad delete would remove the other's bundles.
          assets="$(gh release view "${RELEASE_TAG}" --json assets \
            --jq ".assets[].name | select(contains(\"${MACOS_ASSET_TOKEN}\"))" || true)"

          if [[ -z "${assets}" ]]; then
            echo "No ${MACOS_ASSET_TOKEN} assets to withdraw."
            exit 0
          fi

          while IFS= read -r asset; do
            [[ -n "${asset}" ]] || continue
            echo "::warning::Withdrawing unnotarised ${asset}"
            gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes
          done <<< "${assets}"

          echo "::warning::macOS ${MACOS_ASSET_TOKEN} bundles were signed but not notarised, and have been withheld from ${RELEASE_TAG}."

  publish-release:
    name: Publish release
    # ADR-013 Phase 2. The release is created as a draft and becomes visible only
    # here, once every platform in the matrix has uploaded. `result` is success
    # only when all legs are, so a single platform failure leaves the release a
    # draft rather than publishing a partial one — which is what shipped as v0.0.8.
    if: ${{ always() && github.repository_owner == 'opsydyn' && needs.build-release-assets.result == 'success' }}
    needs:
      - release-plz-release
      - resolve-existing-release
      - build-release-assets
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.release-plz-release.outputs.release_id != '' && needs.release-plz-release.outputs.release_id || needs.resolve-existing-release.outputs.release_id }}
      RELEASE_TAG: ${{ needs.release-plz-release.outputs.release_tag != '' && needs.release-plz-release.outputs.release_tag || needs.resolve-existing-release.outputs.release_tag }}
    steps:
      - name: Publish the release now every platform has uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_ID:-}" ]]; then
            echo "::error::No release id to publish"
            exit 1
          fi

          assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq 'length')"
          if [[ "${assets}" -eq 0 ]]; then
            echo "::error::Refusing to publish ${RELEASE_TAG} with no assets"
            exit 1
          fi

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false --jq '.html_url'

          echo "Published ${RELEASE_TAG} with ${assets} asset(s)." >> "$GITHUB_STEP_SUMMARY"
